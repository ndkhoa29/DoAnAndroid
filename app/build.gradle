plugins {
    alias(libs.plugins.android.application)
    // THÊM DÒNG NÀY: Kích hoạt plugin Google Services
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.example.homeserviceapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.homeserviceapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // --- THÊM CÁC THƯ VIỆN FIREBASE ---
    // Sử dụng BoM để quản lý phiên bản tự động
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.firestore
    implementation libs.firebase.auth

    // --- THÊM THƯ VIỆN GLIDE (Load ảnh từ Firestore) ---
    implementation libs.glide
    annotationProcessor libs.glide.compiler

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}